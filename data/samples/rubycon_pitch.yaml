apiVersion: media-arneis.palladius.it/v1
kind: VideoProject
metadata:
  name: rubycon-pitch
  template: VideoProject
spec:
  project_title: "Rubycon Pitch Video"
  output_filename: "rubycon_pitch_from_plan.mp4"
  scenes:
    - scene: 1
      description: "Opening scene with Rubycon logo and intro music."
