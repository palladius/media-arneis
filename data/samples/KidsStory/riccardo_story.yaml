apiVersion: media-arneis.palladius.it/v1
kind: KidsStory
metadata:
  name: riccardo-the-space-explorer
  template: KidsStory
spec:
  story_title: "Riccardo's Galactic Pizza Quest"
  character_id: riccardo
  pages:
    - page: 1
      description: "Riccardo in a cool space suit, standing next to a rocket shaped like a wine bottle, looking at the stars."
      text: "Riccardo wanted to find the best pizza in the whole galaxy!"
    - page: 2
      description: "Riccardo eating a giant pineapple pizza on a purple moon with two friendly aliens."
      text: "He flew to the Purple Moon and shared a delicious pineapple pizza with his new alien friends."
    - page: 3
      description: "Riccardo flying his rocket back to Earth (Switzerland), with a box of space-pizza on his lap."
      text: "It was the best adventure ever! He brought some pizza back for his family in Switzerland."
  background_music:
    prompt: "An upbeat, synth-wave space adventure theme with a fun Italian accordion twist."
