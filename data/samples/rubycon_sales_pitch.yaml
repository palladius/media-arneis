apiVersion: media-arneis.palladius.it/v1
kind: VideoProject
metadata:
  name: rubycon-2026-sales-pitch
  template: VideoProject
spec:
  project_title: "Rubycon 2026: Code, Community, and the Italian Coast"
  output_filename: "rubycon_2026_pitch_final.mp4"
  scenes:
    - scene: 1
      description: "Cinematic drone shot sweeping across the Rimini seafront at golden hour, transitioning into a vibrant crowd of Ruby developers laughing and networking outside the conference venue."
    - scene: 2
      description: "Close-up of a high-resolution laptop screen displaying elegant Ruby code and the Rubycon logo, with the reflected lights of the Adriatic coast in the background."
    - scene: 3
      description: "Intimate, warm shots of attendees and world-class speakers like Akira Matsuda and Matz (if possible/placeholder) sharing insights over espresso and piadina."
    - scene: 4
      description: "A peaceful sunrise over the historic Rubicon river, fading into a bold call-to-action: 'Rubycon 2026: Cross your own Rubicon. Early bird tickets €149. Join us in Rimini.'"
  background_music:
    prompt: "A joyful, slightly rustic Italian tarantella played on accordion and mandolin, with a modern, upbeat tempo to match the tech energy."
